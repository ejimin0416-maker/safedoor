<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SafeDoor 관제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE work: 학교 시설 관제 화면, 차분하고 정확하게
   IDEA 복도에 붙은 피난안내도 + 건축 화이트 모형 / 홀로그램 테마는 검은 격자 위 하늘색 선 도면
   PICTURE 한 층 전체 3D 모형 위에 설비 위치, 막힘 상태, 경로, 시제품 LED를 직접 표시
   COLOUR 흰 종이 / 먹색 선 / 콘크리트 회색 면 / 소방 적색 · 비상구 녹색 · 주의 노랑
   TYPE IBM Plex Sans KR 600 + 400
   LAYOUT 노트북: 모형 전체 + 오른쪽 368px 패널 + 아래 기록 줄 / 폰: 모형 58vh, 그 아래 패널 */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#151615);--ink:light-dark(#141414,#ecebe6);--mute:light-dark(#5e5e59,#a6a69f);--rule:light-dark(#e3e3de,#30312f);--soft:light-dark(#f2f2ee,#222321);
--scene:light-dark(#f1f1ed,#101110);--room:light-dark(#e4e4df,#262725);--corr:light-dark(#fbfbf8,#30312e);--wc:light-dark(#dde4e7,#232a2d);--stair:light-dark(#d6eadc,#1c3325);
--wall:light-dark(#ffffff,#3b3c39);--line:light-dark(#1a1a18,#8f908a);--desk:light-dark(#c9c9c3,#4a4b46);--board:light-dark(#2f4a3c,#2c4236);--box:light-dark(#c8a072,#8a6a45);
--red:light-dark(#d52b1e,#ff5b4d);--green:light-dark(#0a8a4a,#38c27c);--yellow:light-dark(#e3a900,#f2c94c);--grid:light-dark(#d0d0ca,#2a2b29);--locker:light-dark(#ece6d2,#4c4838);--steel:light-dark(#c2c6ca,#7a8086)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
:root[data-skin=holo]{color-scheme:dark;--bg:#04080b;--ink:#c9efff;--mute:#6ea8bd;--rule:#11303d;--soft:#0a1820;--scene:#010406;--room:#02080c;--corr:#041017;--wc:#02080c;--stair:#03141b;--wall:#46cfff;--line:#5fdcff;--desk:#2fa6d1;--board:#1b6f8f;--box:#ffb44a;--red:#ff4d5e;--green:#3dffb4;--yellow:#ffd34d;--grid:#0e3d4f;--locker:#2fa6d1;--steel:#1b6f8f}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow-x:clip;display:grid;grid-template-rows:auto minmax(0,1fr) auto;word-break:keep-all}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:6px;min-height:38px;padding:0 12px;cursor:pointer}
button:hover{border-color:var(--line)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media(pointer:coarse){button{min-height:44px}}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:10px 16px;border-bottom:1px solid var(--rule)}
header h1{font-size:20px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
header .ttl span{display:block;font-size:13px;color:var(--mute)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0}
.seg button[aria-pressed=true],.tg[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tg.fire[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
main{display:grid;grid-template-columns:minmax(0,1fr) 368px;min-height:0}
#view{position:relative;overflow:hidden;background:var(--scene)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:absolute;inset:0;pointer-events:none}
.rl{position:absolute;left:0;top:0;font-size:13px;line-height:1.2;color:var(--mute);white-space:nowrap;text-align:center}
.rl em{display:block;font-style:normal;font-weight:600;color:var(--green)}
#ov.nolab .rl{display:none!important}
.mk{position:absolute;left:0;top:0;width:0;height:0}
.pin{position:absolute;left:0;bottom:0;transform:translate(-50%,-4px);display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;font-weight:600;line-height:1;padding:6px 10px 6px 8px;border-radius:999px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);pointer-events:auto;min-height:28px}
.pin small{font-size:13px;font-weight:400;display:none}
#ov.heat .pin small{display:inline}
#ov.plan .mk.s .pin{bottom:auto;top:0;transform:translate(-50%,4px)}
.dot,.sd{flex:none;width:10px;height:10px;border-radius:50%;background:var(--green)}
.mk[data-s=caution] .pin{background:var(--yellow);border-color:var(--yellow);color:#1c1600}
.mk[data-s=danger] .pin{background:var(--red);border-color:var(--red);color:#fff}
.mk[data-s=off] .pin{border-style:dashed;color:var(--mute)}
.mk[data-s=caution] .dot,.mk[data-s=danger] .dot{background:currentColor}
.mk.fh .pin{border-radius:6px}
.mk.fh .dot,.sd.sq{border-radius:2px}
.lgk{width:12px;height:12px;border:1.5px solid var(--ink);border-radius:50%;display:inline-block}
.lgk.sq{border-radius:3px}
.tg.edit{border-style:dashed}
.simfab{position:absolute;top:12px;right:12px;z-index:3;font-weight:600;min-height:40px;padding:0 14px;border:1.5px solid var(--ink);background:var(--bg)}
.simfab[aria-pressed=true]{background:var(--ink);color:var(--bg)}
body.simon #legend,body.simon #skip{display:none}
.simtag{position:absolute;left:0;top:0;pointer-events:none;text-align:center;white-space:nowrap;background:var(--bg);border:2px solid var(--green);border-radius:8px;padding:6px 12px;line-height:1.3}
.simtag b{display:block;font-size:20px;letter-spacing:.01em}
.simtag span{font-size:13px;color:var(--mute)}
.simtag[data-s=caution]{border-color:var(--yellow)}
.simtag[data-s=danger]{border-color:var(--red);background:var(--red);color:#fff}
.simtag[data-s=danger] span{color:#fff}
.simtag[data-s=off]{border-color:var(--mute)}
.simlab{position:absolute;left:0;top:0;pointer-events:none;font-size:13px;white-space:nowrap;color:var(--mute);background:color-mix(in srgb,var(--bg) 85%,transparent);padding:1px 5px;border-radius:4px}
.simlab.in{color:#fff;background:var(--red);font-weight:600}
.simlab.rul{background:none;padding:0}
.steps{margin:0 0 12px;padding-left:20px;font-size:14px}
.steps li{margin:4px 0}
.erow.on{background:var(--soft)}
.p input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;margin-top:4px}
#eOut{width:100%;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:8px;resize:vertical;white-space:pre;overflow:auto}
.pin .fd{display:none;font-style:normal;font-weight:400}
body.fire .pin .fd{display:inline}
.mk.sel .pin{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.sd[data-s=caution]{background:var(--yellow)}
.sd[data-s=danger]{background:var(--red)}
.sd[data-s=off],.mk[data-s=off] .dot{background:var(--mute)}
.tag{position:absolute;left:0;top:0;font-size:13px;font-weight:600;color:#fff;background:var(--red);padding:4px 8px;border-radius:4px;white-space:nowrap}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 55%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@keyframes beacon{50%{opacity:.35}}
@media(prefers-reduced-motion:no-preference){.mk[data-s=danger]:not(.sel) .pin{animation:pulse 1.6s infinite}body.fire .mk:not([data-s=danger]) .pin{animation:beacon 1s steps(2) infinite}}
#hud{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 24px);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;font-size:14px;line-height:1.45}
#hud b{font-weight:600}
#legend{position:absolute;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mute);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:7px 10px}
#legend span{display:inline-flex;align-items:center;gap:6px}
#legend i{width:16px;height:4px;background:var(--ink);display:inline-block}
#skip{position:absolute;left:50%;top:12px;transform:translateX(-50%);font-size:13px;color:var(--mute);background:var(--bg);border:1px solid var(--rule);border-radius:999px;padding:5px 12px}
#nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mute)}
aside{border-left:1px solid var(--rule);overflow-y:auto;background:var(--bg);position:relative}
.sidetop{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;padding:6px 10px 0;background:var(--bg)}
.lnk{border:0;background:none;color:var(--mute);min-height:32px;padding:0 6px;font-size:14px}
.lnk:hover{color:var(--ink)}
main.col{grid-template-columns:minmax(0,1fr) 52px}
main.col #panel{display:none}
main.col .sidetop{height:100%;padding:8px 0;justify-content:center}
main.col #pCol{writing-mode:vertical-rl;min-height:120px;color:var(--ink)}
details.sec{margin-top:12px;border-top:1px solid var(--rule);padding-top:6px}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;font-weight:600;line-height:1.35;min-height:38px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:translateY(-3px) rotate(45deg)}
details.sec:not([open])>summary::after{transform:rotate(-45deg)}
details.sec>summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
details.sec .sb{padding:2px 0 8px}
.secbar{display:flex;justify-content:flex-end;margin-top:10px}
.stp{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:14px;color:var(--mute)}
.stp select{flex:1;font:inherit;font-size:16px;min-height:40px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:0 8px}
.auto{margin:0 0 6px;font-size:13px;color:var(--red);font-weight:600}
.ftag{position:absolute;left:0;top:0;pointer-events:auto;font-size:14px;font-weight:700;min-height:32px;padding:0 10px;border-radius:6px;background:var(--bg);border:1.5px solid var(--line);white-space:nowrap}
.ftag.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.p{padding:18px 18px 28px}
.p h2{font-size:28px;line-height:1.12;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance;font-weight:700}
.sub{margin:0 0 14px;color:var(--mute);font-size:15px}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:12px}
.figs div{padding:10px 8px 10px 0}
.figs div+div{padding-left:10px;border-left:1px solid var(--rule)}
.figs b{display:block;font-size:24px;line-height:1.15;white-space:nowrap;font-variant-numeric:tabular-nums}
.figs span{font-size:13px;color:var(--mute)}
.sec{margin-top:22px}
.sec h3{font-size:15px;line-height:1.35;margin:0 0 10px;font-weight:600}
.sec p{margin:0;font-size:15px}
.hrs{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:2px;height:84px;align-items:end;border-bottom:1px solid var(--line)}
.hrs i{display:block;background:var(--desk);min-height:1px}
.hrs i.pk{background:var(--ink)}
.hax{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:4px}
.row{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:6px 10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:10px 2px;background:none;min-height:44px}
.row .rv{font-variant-numeric:tabular-nums;white-space:nowrap}
.row .rb{grid-column:2/4;height:4px;background:var(--soft)}
.row .rb i{display:block;height:100%;background:var(--ink)}
.row .rn b{font-weight:600}
.back{border:0;padding:0 4px 0 0;margin:-6px 0 8px;color:var(--mute)}
.state{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:12px 0;margin-top:12px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.st{font-size:13px;font-weight:600;padding:3px 9px;border-radius:4px;background:var(--green);color:#fff;white-space:nowrap}
.st[data-s=caution]{background:var(--yellow);color:#1c1600}
.st[data-s=danger]{background:var(--red)}
.st[data-s=off]{background:var(--mute)}
.state b{font-size:20px;line-height:1.2}
.state .tm{grid-column:2;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.sn{display:grid;grid-template-columns:4.6em minmax(0,1fr) 3.6em;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.sn .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{position:relative;height:8px;background:var(--soft);border-radius:4px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--line)}
.bar i.in{background:var(--red)}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--red)}
.why{margin-top:10px!important;color:var(--mute)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ev{list-style:none;margin:0;padding:0;font-size:14px}
.ev li{display:grid;grid-template-columns:10px 3.2em minmax(0,1fr);gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--rule)}
.ev time{color:var(--mute);font-variant-numeric:tabular-nums}
.ev .sd{transform:translateY(-1px)}
table.kv{width:100%;border-collapse:collapse;font-size:14px}
.kv td{padding:6px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.kv td:first-child{color:var(--mute);width:7.5em;padding-right:10px}
.seg3{display:flex;gap:8px;flex-wrap:wrap}
.seg3 button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{font-size:13px!important;color:var(--mute);margin-top:18px!important}
.no{color:var(--red);font-weight:600}
.proto{border-top:1px solid var(--rule);padding-top:16px}
.ledrow{display:flex;gap:16px;align-items:center;margin:14px 0 6px}
.ring{position:relative;width:76px;height:76px;flex:none;border-radius:50%;background:var(--soft);border:1px solid var(--rule)}
.ring i{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:var(--led,#2b2b2b);box-shadow:0 0 7px var(--glow,transparent)}
.fw b{display:block;font-size:19px;line-height:1.2}
.fw span{display:block;font-size:14px;color:var(--mute)}
.flags{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin:8px 0 4px}
.flags b{font-weight:600}
.rg{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-top:14px}
input[type=range]{width:100%;height:30px;accent-color:var(--ink);margin:2px 0 0}
.sim{margin-top:16px;padding:12px;border:1px dashed var(--rule);border-radius:8px}
.sim h3{margin-bottom:6px}
footer{display:flex;align-items:center;gap:6px;overflow-x:auto;border-top:1px solid var(--rule);padding:6px 12px;white-space:nowrap}
footer b{font-size:13px;margin-right:10px;flex:none}
.lg{display:inline-flex;align-items:center;gap:7px;border:0;background:none;font-size:13px;min-height:34px;padding:0 8px;flex:none}
.lg time{color:var(--mute);font-variant-numeric:tabular-nums}
@media(max-width:820px){
html,body{height:auto}
body{display:block}
main{display:block}
#view{height:58vh;min-height:340px}
aside{border-left:0;border-top:1px solid var(--rule)}
footer{position:sticky;bottom:0;background:var(--bg)}
}
@media(max-width:600px){#legend{display:none}.p h2{font-size:24px}header h1{font-size:18px}}
</style>
</head>
<body>
<header>
  <div class="ttl"><h1>SafeDoor 관제</h1><span>복정고 본관 1~4층 · 2층 피난안내도 기반 근사 도면</span></div>
  <div class="tools">
    <div class="seg" role="group" aria-label="층">
      <button id="flall" aria-pressed="true">모든 층</button>
      <button id="fl1" aria-pressed="false">1층</button>
      <button id="fl2" aria-pressed="false">2층</button>
      <button id="fl3" aria-pressed="false">3층</button>
      <button id="fl4" aria-pressed="false">4층</button>
    </div>
    <div class="seg" role="group" aria-label="보기 방식">
      <button id="v3d" aria-pressed="true">3D</button>
      <button id="vplan" aria-pressed="false">평면도</button>
    </div>
    <div class="seg" role="group" aria-label="설비 종류">
      <button id="fall" aria-pressed="true">모두</button>
      <button id="fFE" aria-pressed="false">소화기함</button>
      <button id="fFH" aria-pressed="false">소화전</button>
    </div>
    <button id="tXray" class="tg" aria-pressed="false">벽 투시</button>
    <button id="tSkin" class="tg" aria-pressed="false">홀로그램</button>
    <button id="tHeat" class="tg" aria-pressed="false">막힘 빈도</button>
    <button id="tLab" class="tg" aria-pressed="true">실 이름</button>
    <button id="tMask" class="tg" aria-pressed="true">아래쪽 가림</button>
    <button id="tFire" class="tg fire" aria-pressed="false">화재 시뮬레이션</button>
    <button id="tFit">전체 보기</button>
    <button id="tEdit" class="tg edit" aria-pressed="false">위치 찍기 (임시)</button>
  </div>
</header>
<main>
  <section id="view" aria-label="복정고 본관 2층 모형">
    <canvas id="c"></canvas>
    <div id="ov"></div>
    <div id="hud" hidden></div>
    <button id="tSim" class="simfab" aria-pressed="false">시뮬 공간</button>
    <div id="skip" hidden>화면을 누르면 건너뜁니다</div>
    <div id="legend">
      <span><span class="lgk"></span>소화기함</span>
      <span><span class="lgk sq"></span>소화전</span>
      <span><span class="sd"></span>정상</span>
      <span><span class="sd" data-s="caution"></span>주의</span>
      <span><span class="sd" data-s="danger"></span>위험</span>
      <span><i></i>관리자 경로</span>
      <span class="lf" hidden><i style="background:var(--red)"></i>소화기까지</span>
      <span class="lf" hidden><i style="background:var(--green)"></i>대피</span>
    </div>
    <div id="nogl" hidden>이 브라우저에서는 3D 모형을 그릴 수 없습니다. 오른쪽 현황과 기록은 그대로 볼 수 있습니다.</div>
  </section>
  <aside id="side"><div class="sidetop"><button id="pCol" class="lnk" aria-expanded="true" aria-controls="panel">접기</button></div><div id="panel" aria-live="polite"></div></aside>
</main>
<footer id="log"></footer>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const CS=.5,X0=-21,Z0=-1,NX=210,NZ=86,N=NX*NZ,WH=2,WT=.2,FR=3.5,WALK=1.3,RUN=3;

 for(let i=0;i<pts.length-1;i++){const p=pts[i],q=pts[i+1],dx=q.x-p.x,dz=q.z-p.z,L=Math.hypot(dx,dz);cum.push(cum[i]+L);const m=new THREE.Mesh(new THREE.BoxGeometry(L,.03,w),mat);m.position.set((p.x+q.x)/2,.06,(p.z+q.z)/2);m.rotation.y=-Math.atan2(dz,dx);g.add(m)}

 const e=pts[pts.length-1],ring=new THREE.Mesh(new THREE.RingGeometry(.42,.6,32),mat);ring.rotation.x=-Math.PI/2;ring.position.set(e.x,.07,e.z);g.add(ring);

 $('#tFire').setAttribute('aria-pressed',on);document.body.classList.toggle('fire',on);document.querySelectorAll('.lf').forEach(e=>e.hidden=!on);
 if(on){if(edit)toggleEdit(false);if(intro)endIntro();if(effFloor()!==2&&effFloor()!=='all')setFloor(2,true);sel=null;markSel();hideRoute();mode='fire';runFire({x:50.5,z:34});
  const h=$('#hud');h.hidden=false;h.innerHTML='<b>화재 시뮬레이션</b> 평면 위를 누르면 화재 지점이 옮겨집니다.';fit()}
 else{fire=null;mode='overview';Object.keys(pathG).filter(k=>k.startsWith('r_')).forEach(clearPath);['ext','evac','blk'].forEach(clearPath);fireRings=[];if(fireG){scene.remove(fireG);fireG=null}fireTag.hidden=true;$('#hud').hidden=true;renderPanel()}
}

/* ---------- 위치 찍기 (임시 도구 · 좌표를 다 받으면 지운다) ---------- */
const r1=v=>Math.round(v*10)/10;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dirName=d=>d.nz<0?'북쪽':d.nz>0?'남쪽':d.nx<0?'서쪽':'동쪽';
const hudMsg=h=>{const e=$('#hud');e.hidden=false;e.innerHTML=h};
function coordText(){return['// SafeDoor 2층 설비 위치 · x, z 단위 m · 마지막 두 숫자는 설비가 바라보는 방향','// D(번호, 종류, 위치 이름, x, z, 방향x, 방향z)',...DEV.map(d=>`D('${d.id}','${d.t}','${d.loc.replace(/'/g,'')}',${r1(d.x)},${r1(d.z)},${d.nx},${d.nz}) // ${KIND[d.t]} · ${dirName(d)}을 바라봄 · 앞: ${roomAt(d.front.x,d.front.z)}${d.added?' · 새로 추가':d.moved?' · 옮김':''}`)].join('\n')}
function snapWall(p,d){
 let best=null,bd=1.8;
 for(const[x1,z1,x2,z2]of WALLS){const h=z1===z2,qx=h?Math.min(Math.max(p.x,x1),x2):x1,qz=h?z1:Math.min(Math.max(p.z,z1),z2),dd=Math.hypot(p.x-qx,p.z-qz);if(dd<bd){bd=dd;best={h,x1,z1,x2,z2,qx,qz}}}
 if(!best)return null;const m=d.w/2+.05;let{qx,qz}=best;
 if(best.h)qx=best.x2-best.x1>2*m?Math.min(Math.max(qx,best.x1+m),best.x2-m):(best.x1+best.x2)/2;
 else qz=best.z2-best.z1>2*m?Math.min(Math.max(qz,best.z1+m),best.z2-m):(best.z1+best.z2)/2;
 let nx=best.h?0:(Math.sign(p.x-qx)||1),nz=best.h?(Math.sign(p.z-qz)||1):0;
 const inside=(a,b)=>{const k=ci(a,b);return k>=0&&REG[k]>0};
 if(!inside(qx+nx*.6,qz+nz*.6)&&inside(qx-nx*.6,qz-nz*.6)){nx=-nx;nz=-nz}
 return{x:r1(qx),z:r1(qz),nx:nx||0,nz:nz||0};
}
function refreshDev(d){placeDev(d);rebuildStatic();removeDevMesh(d);addDevMesh(d);buildLockers();d.el.className=mkClass(d);renderEdit()}
function editClick(ray){
 const hit=new THREE.Vector3();if(!ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-FY()),hit))return;
 const d=editSel&&byId(editSel);
 if(!d){const h=ray.intersectObjects(devMesh,false)[0];if(h){editSel=h.object.userData.id;markSel();renderEdit();return}
  hudMsg(`<b>찍은 곳</b> x ${r1(hit.x)} · z ${r1(hit.z)} · ${roomAt(hit.x,hit.z)}`);return}
 const sn=snapWall(hit,d);
 if(!sn){hudMsg('벽에서 너무 멉니다. 설비가 붙은 벽 가까이를 누르세요.');return}
 Object.assign(d,sn);d.moved=true;refreshDev(d);
 hudMsg(`<b>${d.id}</b> → x ${d.x} · z ${d.z} · ${dirName(d)}을 바라봄 · 앞: ${roomAt(d.front.x,d.front.z)}`);
}
function addDev(t){
 const n=Math.max(0,...DEV.filter(d=>d.t===t).map(d=>+d.id.slice(3)||0))+1,id=`${t}-${String(n).padStart(2,'0')}`;
 const d=D(id,t,'새 위치',22,27,0,1,{f:0,ago:0,added:true});initDev(d);d.stage=0;DEV.push(d);
 rebuildStatic();addDevMesh(d);addMarker(d);buildLockers();editSel=id;markSel();renderEdit();
 hudMsg(`<b>${id}</b> 추가함 · 평면도에서 실제 자리의 벽을 누르세요`);
}
function delDev(d){removeDevMesh(d);d.el.remove();DEV.splice(DEV.indexOf(d),1);editSel=null;rebuildStatic();buildLockers();renderEdit();hudMsg(`<b>${d.id}</b> 삭제함`)}
function renderEdit(){
 const s=editSel&&byId(editSel);
 panel.innerHTML=`<div class="p">
 <h2>설비 위치 찍기</h2><p class="sub">임시 도구 · 다 찍은 뒤 아래 좌표를 복사해서 보내주세요</p>
 <ol class="steps"><li>목록이나 평면도에서 옮길 설비를 고릅니다.</li><li>평면도에서 그 설비가 붙은 벽의 바깥쪽(설비가 보이는 쪽)을 누릅니다. 가장 가까운 벽에 붙습니다.</li><li>위치 이름을 고친 뒤 좌표 복사를 누릅니다.</li></ol>
 <div class="acts"><button id="eAddFE">소화기함 추가</button><button id="eAddFH">소화전 추가</button></div>
 ${s?`<section class="sec ed"><h3>${s.id} ${KIND[s.t]}</h3><label class="rg" for="eLoc"><span>위치 이름</span></label><input id="eLoc" type="text" value="${esc(s.loc)}"><p class="why">x ${r1(s.x)} · z ${r1(s.z)} · ${dirName(s)}을 바라봄 · 앞: ${roomAt(s.front.x,s.front.z)}</p><div class="acts"><button id="eFlip">방향 뒤집기</button><button id="eDel"${s.proto?' disabled title="시제품 자리는 지울 수 없습니다"':''}>삭제</button><button id="eOff">고르기 해제</button></div></section>`
  :'<p class="why" style="margin-top:16px">고른 설비가 없습니다. 지금 평면도를 누르면 그 자리 좌표만 보여줍니다.</p>'}
 ${['FE','FH'].map(t=>`<section class="sec"><h3>${t==='FE'?'소화기함':'옥내소화전'} ${DEV.filter(d=>d.t===t).length}곳</h3>${DEV.filter(d=>d.t===t).map(d=>`<button class="row erow${d.id===editSel?' on':''}" data-id="${d.id}"><span class="sd ${t==='FH'?'sq':''}" data-s="${d.added||d.moved?'caution':'normal'}"></span><span class="rn"><b>${d.id}</b> ${esc(d.loc)}</span><span class="rv">${r1(d.x)}, ${r1(d.z)}</span></button>`).join('')}</section>`).join('')}
 <section class="sec"><h3>보낼 좌표</h3><textarea id="eOut" readonly rows="9" aria-label="설비 좌표">${esc(coordText())}</textarea><div class="acts"><button id="eCopy">좌표 복사</button><span class="why" id="eMsg" style="margin:0!important;align-self:center">${copyMsg}</span></div></section>
 <p class="note">노란 점은 옮기거나 새로 추가한 설비입니다. 새로고침하면 바뀐 위치가 사라지니 그 전에 복사하세요.</p></div>`;
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 on('#eAddFE',()=>addDev('FE'));on('#eAddFH',()=>addDev('FH'));
 on('#eFlip',()=>{s.nx=-s.nx||0;s.nz=-s.nz||0;s.moved=true;refreshDev(s)});
 on('#eDel',()=>delDev(s));on('#eOff',()=>{editSel=null;markSel();renderEdit()});
 const loc=$('#eLoc');if(loc)loc.oninput=()=>{s.loc=loc.value;$('#eOut').value=coordText()};
 panel.querySelectorAll('.erow').forEach(b=>b.onclick=()=>{editSel=b.dataset.id;markSel();renderEdit();const d=byId(editSel);if(gl)goTo({...cur(),tx:d.front.x,tz:d.front.z},600)});
 on('#eCopy',()=>{const t=coordText(),msg=m=>{copyMsg=m;const e=$('#eMsg');if(e)e.textContent=m};
  try{navigator.clipboard.writeText(t).then(()=>msg('복사했습니다'),()=>{$('#eOut').select();msg('Ctrl+C로 직접 복사하세요')})}catch(e){$('#eOut').select();msg('Ctrl+C로 직접 복사하세요')}});
}
function toggleEdit(on){
 if(on&&simOn)toggleSim(false);
 edit=on;$('#tEdit').setAttribute('aria-pressed',on);
 if(on){if(intro)endIntro();if(fire)toggleFire(false);if(effFloor()!==2&&effFloor()!=='all')setFloor(2,true);sel=null;editSel=null;copyMsg='';hideRoute();mode='edit';markSel();renderEdit();if(view!=='plan')setView('plan');hudMsg('<b>위치 찍기</b> 설비를 고른 뒤 평면도에서 벽을 누르세요.')}
 else{editSel=null;mode='overview';markSel();$('#hud').hidden=true;renderPanel()}
}

/* ---------- 입력 ---------- */
let down=null;
canvas.addEventListener('pointerdown',e=>{if(intro){endIntro();return}down={x:e.clientX,y:e.clientY,t:performance.now()}});
canvas.addEventListener('pointerup',e=>{
 if(!down||!gl)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);const quick=performance.now()-down.t<500;down=null;if(moved>6||!quick)return;
 const rc=canvas.getBoundingClientRect(),m=new THREE.Vector2((e.clientX-rc.left)/rc.width*2-1,-((e.clientY-rc.top)/rc.height)*2+1),ray=new THREE.Raycaster();ray.setFromCamera(m,cam);
 if(simOn){simClick(ray);return}
 if(!scene.visible)return;
 if(pickStart){const hit=new THREE.Vector3();if(ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-FY()),hit)){const k=ci(hit.x,hit.z);if(k>=0&&REG[k]){pickStart=false;setStart({n:`직접 고른 곳 (${roomAt(hit.x,hit.z)})`,x:r1(hit.x),z:r1(hit.z),f:2});return}}hudMsg('건물 안쪽을 누르세요.');return}
 if(edit){editClick(ray);return}
 if(fire){const hit=new THREE.Vector3();if(ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-FY()),hit)){const k=ci(hit.x,hit.z);if(k>=0&&REG[k]&&!SB[k])runFire({x:hit.x,z:hit.z})}return}
 const h=ray.intersectObjects(devMesh,false)[0];if(h)select(h.object.userData.id);
});
const tog=(id,k,f)=>{$(id).onclick=()=>{layers[k]=!layers[k];$(id).setAttribute('aria-pressed',layers[k]);f()}};
$('#v3d').onclick=()=>setView('3d');
$('#vplan').onclick=()=>setView('plan');
$('#tFit').onclick=fit;
$('#tFire').onclick=()=>toggleFire(!fire);
tog('#tHeat','heat',()=>{ov.classList.toggle('heat',layers.heat);if(gl)DEV.forEach(applyVis)});
function setFilter(t){showT=t;[['fall','all'],['fFE','FE'],['fFH','FH']].forEach(([id,k])=>$('#'+id).setAttribute('aria-pressed',k===t));DEV.forEach(applyVis);if(sel&&!shown(byId(sel)))deselect();else if(mode==='overview')renderOverview()}
$('#fall').onclick=()=>setFilter('all');$('#fFE').onclick=()=>setFilter('FE');$('#fFH').onclick=()=>setFilter('FH');
$('#tEdit').onclick=()=>toggleEdit(!edit);
$('#tSim').onclick=()=>toggleSim(!simOn);
$('#flall').onclick=()=>setFloor('all');[1,2,3,4].forEach(k=>$('#fl'+k).onclick=()=>setFloor(k));
$('#pCol').onclick=()=>{const m=$('main'),c=!m.classList.contains('col');m.classList.toggle('col',c);$('#pCol').setAttribute('aria-expanded',!c);$('#pCol').textContent=c?'현황 펼치기':'접기'};
tog('#tLab','lab',()=>ov.classList.toggle('nolab',!layers.lab));
tog('#tMask','mask',()=>{if(maskG)maskG.visible=layers.mask});
tog('#tXray','xray',applyTheme);
$('#tSkin').onclick=()=>{const on=!holo();if(on)document.documentElement.dataset.skin='holo';else delete document.documentElement.dataset.skin;$('#tSkin').setAttribute('aria-pressed',on);try{localStorage.setItem('sd-skin',on?'holo':'')}catch(e){}};
addEventListener('keydown',e=>{
 if(e.target.closest&&e.target.closest('input,textarea'))return;
 if(intro){endIntro();return}
 const d=sel&&byId(sel);
 if(e.key==='Escape'){simOn?toggleSim(false):edit?toggleEdit(false):fire?toggleFire(false):sel&&deselect()}
 else if(d&&!fire&&['1','2','3'].includes(e.key)){if(d.proto){if(sim){sim.obj=e.key!=='1';const b=$('#sObj');if(b)b.setAttribute('aria-pressed',sim.obj)}}else{const st=['normal','caution','danger'][+e.key-1];if(d.st!==st)setStatus(d,st)}}
 else if(e.key==='v'||e.key==='V')setView(view==='plan'?'3d':'plan');
 else if(e.key==='f'||e.key==='F')toggleFire(!fire);
 else if(e.key==='x'||e.key==='X')$('#tXray').click();
});
// 다른 코드에서 쓰는 입구: SafeDoor.feed('T,RED,0,1,30,34,47,999,4,50,1,0') 또는 SafeDoor.set('FE-03','danger')
window.SafeDoor={feed:onLine,send,set:(id,st)=>{const d=byId(id);if(d&&!d.proto&&LAB[st]&&d.st!==st)setStatus(d,st)},get devices(){return DEV.map(d=>d.id)},route:id=>{const d=byId(id);return d?routeTo(d):null}};

/* ---------- 시간 ---------- */
setInterval(()=>{
 const now=Date.now();document.querySelectorAll('[data-since]').forEach(el=>el.textContent=dur(now-+el.dataset.since));
 DEV.forEach(d=>{if(d.proto||d.st!=='danger')return;const s=stageOf(now-d.since);if(s!==d.stage){d.stage=s;pushLog({t:now,id:d.id,lv:'danger',m:STG[s]});const el=$('#stage');if(el&&sel===d.id)el.textContent=STG[s]}});
 if(P.src==='ble'&&now-P.last>4000&&!P.msg)P.msg='시제품 신호가 4초 넘게 없습니다.';
 else if(P.src==='ble'&&now-P.last<=4000&&P.msg==='시제품 신호가 4초 넘게 없습니다.')P.msg='';
 updateProto();
},1000);

/* ---------- 시작 ---------- */
function endIntro(){if(!intro)return;intro=false;$('#skip').hidden=true;if(anim)anim.t0=-1e9}
try{if(localStorage.getItem('sd-skin')==='holo'){document.documentElement.dataset.skin='holo';$('#tSkin').setAttribute('aria-pressed','true')}}catch(e){}
startSim();
renderLog();
if(gl){
 build();
 const resize=()=>{const w=VW(),h=VH();renderer.setSize(w,h,false);cam.aspect=w/Math.max(1,h);cam.updateProjectionMatrix()};
 const ro=new ResizeObserver(resize);ro.observe(viewEl);resize();
 const end=def3d(),start={...end,r:end.r*1.45,phi:.55,theta:end.theta-2*Math.PI};
 applyCam(start);
 if(RM)applyCam(end);else{intro=true;$('#skip').hidden=false;goTo(end,7500,()=>{intro=false;$('#skip').hidden=true},start)}
 const loop=t=>{
  if(anim){const k=anim.ms?Math.min(1,(performance.now()-anim.t0)/anim.ms):1,e=k<.5?4*k*k*k:1-((2-2*k)**3)/2,s={};for(const key in anim.to)s[key]=anim.from[key]+(anim.to[key]-anim.from[key])*e;applyCam(s);if(k>=1){const dn=anim.done;anim=null;ctl.enabled=true;ctl.update();if(dn)dn()}}
  else ctl.update();
  moveTokens(t);ledTick(t);simTick(t);
  if(fire&&!RM)fireRings.forEach(m=>{const k=(t/1400+m.userData.ph)%1;m.scale.setScalar(1+k*2.2);m.material.opacity=.85*(1-k)});renderer.render(world,cam);overlay();requestAnimationFrame(loop);
 };
 requestAnimationFrame(loop);
}else{setInterval(()=>ledTick(performance.now()),100)}
renderPanel();if(mode==='device'&&sel&&routeOn)showRoute(byId(sel));
window.__sd={REG,WALLS,ROOMS,astar,grid,START,DEV,proj:(x,z)=>gl?proj(x,0,z):null,setFloor,setStart};
}
